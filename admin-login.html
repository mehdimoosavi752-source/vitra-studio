<!doctype html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title data-fa="ورود مدیریت — ویترا استودیو" data-en="Admin Sign In — Vitra Studio">ورود مدیریت — ویترا استودیو</title>
  <meta name="robots" content="noindex,nofollow"/>
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg"/>
  <link rel="stylesheet" href="styles.css?v=20260719-livefix"/>
</head>
<body data-page="admin-login" class="auth-page">
  <header class="topbar" id="topbar">
    <a class="brand" href="index.html">
      <img src="assets/vitra-logo.svg" alt="Vitra Studio logo" decoding="async">
      <span class="brand-name" data-fa="ویـترا استودیو" data-en="Vitra Studio">Vitra Studio</span>
    </a>
    <nav class="t-nav">
      <a href="index.html" data-fa="خانه" data-en="Home">Home</a>
      <a href="services.html" data-fa="خدمات" data-en="Services">Services</a>
      <a href="portfolio.html" data-fa="دموها" data-en="Demos">Demos</a>
      <a href="login.html" data-fa="ورود یکپارچه" data-en="Unified login">Unified login</a>
    </nav>
    <button class="lang-btn" type="button">FA</button>
  </header>

  <main class="auth-stage">
    <div class="auth-orb auth-orb-a"></div>
    <div class="auth-orb auth-orb-b"></div>
    <section class="auth-shell auth-shell-single">
      <div class="auth-copy">
        <p class="kicker" data-fa="مسیر امن مدیریت" data-en="Secure admin access">Secure admin access</p>
        <h1 data-fa="ورود مدیر بدون نمایش اطلاعات حساس" data-en="Admin login without exposed credentials">Admin login without exposed credentials</h1>
        <p data-fa="این مسیر فقط برای حساب‌های مدیریتی فعال است. کاربران عادی حتی اگر این صفحه را باز کنند، به پنل مشتری هدایت نمی‌شوند و دسترسی مدیریتی نمی‌گیرند." data-en="This route only accepts admin accounts. Regular users cannot access management features from here.">This route only accepts admin accounts. Regular users cannot access management features from here.</p>
        <div class="auth-points">
          <span data-fa="ورود نقش‌محور" data-en="Role-based login">Role-based login</span>
          <span data-fa="بدون نمایش رمز نمونه" data-en="No public sample password">No public sample password</span>
          <span data-fa="هدایت امن به پنل" data-en="Secure panel routing">Secure panel routing</span>
        </div>
      </div>

      <div class="auth-card">
        <form data-login-form data-login-scope="admin" class="auth-form active">
          <div class="field">
            <label for="admin-user" data-fa="نام کاربری مدیریت" data-en="Admin username">نام کاربری مدیریت</label>
            <input id="admin-user" name="username" required autocomplete="username" data-fa-placeholder="نام کاربری یا ایمیل مدیر" data-en-placeholder="Admin username or email" placeholder="Admin username or email"/>
          </div>
          <div class="field">
            <label for="admin-pass" data-fa="رمز عبور مدیریت" data-en="Admin password">رمز عبور مدیریت</label>
            <input id="admin-pass" name="password" type="password" required autocomplete="current-password" data-fa-placeholder="رمز عبور" data-en-placeholder="Password" placeholder="Password"/>
          </div>
          <button class="btn btn-primary auth-submit" type="submit" data-fa="ورود به مدیریت" data-en="Sign in to admin">Sign in to admin</button>
          <p class="login-error" data-login-error hidden></p>
        </form>
      </div>
    </section>
  </main>
  <script src="app.js?v=20260719-livefix"></script>
</body>
</html>
