services:
  - type: web
    name: allameh-sokhan-site
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: allameh-sokhan-db
          property: connectionString
      - key: ADMIN_EMAIL
        value: admin@asmdi.ir
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_NAME
        value: مدیر سایت
      - key: RESET_ADMIN_PASSWORD
        value: "true"
      - key: COOKIE_SECURE
        value: "true"
      - key: NODE_ENV
        value: production
      - key: SESSION_SECRET
        sync: false
      - key: EMAIL_WEBHOOK_URL
        sync: false
      - key: EMAIL_WEBHOOK_TOKEN
        sync: false
      - key: SMS_ENABLED
        value: "false"
      - key: SMS_PROVIDER
        value: melipayamak
      - key: SMS_USERNAME
        sync: false
      - key: SMS_API_KEY
        sync: false
      - key: SMS_SENDER
        sync: false
      - key: SMS_ADMIN_NUMBERS
        sync: false
      - key: SMS_MELIPAYAMAK_URL
        value: https://rest.payamak-panel.com/api/SendSMS/SendSMS

databases:
  - name: allameh-sokhan-db
    plan: free
    databaseName: allameh_sokhan
    user: allameh
