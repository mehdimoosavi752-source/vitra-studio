services:
  - type: web
    name: allameh-sokhan-site
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        value: 3306
      - key: DB_NAME
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: ADMIN_EMAIL
        value: admin@asmdi.ir
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_NAME
        value: مدیر سایت
      - key: RESET_ADMIN_PASSWORD
        value: "false"
      - key: COOKIE_SECURE
        value: "true"
      - key: SESSION_SECRET
        sync: false
