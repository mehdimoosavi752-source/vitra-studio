<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ورود به پنل | Vitra Studio</title>
    <link rel="icon" type="image/svg+xml" href="assets/favicon.svg" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body data-page="login">
    <main class="login-page">
      <section class="login-card">
        <a class="brand" href="index.html">
          <span class="brand-mark"><img src="assets/vitra-logo.svg" alt="" /></span>
          <span class="brand-text"><strong>Vitra Studio</strong><small data-fa="ورود مشتری و مدیر" data-en="Client and admin login">ورود مشتری و مدیر</small></span>
        </a>
        <div>
          <p class="eyebrow">Vitra Portal</p>
          <h1 data-fa="ورود به پنل مدیریت خدمات دیجیتال" data-en="Login to the digital services portal">ورود به پنل مدیریت خدمات دیجیتال</h1>
          <p data-fa="این نسخه نمایشی است؛ با انتخاب نقش وارد محیط پنل می‌شوی." data-en="This is a demo. Choose a role to enter the portal.">این نسخه نمایشی است؛ با انتخاب نقش وارد محیط پنل می‌شوی.</p>
        </div>
        <form>
          <label><span data-fa="ایمیل" data-en="Email">ایمیل</span><input type="email" value="demo@vitrastudio.ir" /></label>
          <label><span data-fa="رمز عبور" data-en="Password">رمز عبور</span><input type="password" value="12345678" /></label>
          <div class="login-actions">
            <a class="btn btn-primary" href="panel.html#admin" data-fa="ورود مدیر" data-en="Admin login">ورود مدیر</a>
            <a class="btn btn-ghost" href="panel.html#client" data-fa="ورود مشتری" data-en="Client login">ورود مشتری</a>
          </div>
        </form>
        <button class="lang-switch" type="button">EN</button>
      </section>
      <section class="login-visual">
        <img src="assets/studio-command-hero.png" alt="" />
      </section>
    </main>
    <script src="app.js"></script>
  </body>
</html>
