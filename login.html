<!doctype html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title data-fa="ورود به پنل — ویترا استودیو" data-en="Portal Login — Vitra Studio">Portal Login — Vitra Studio</title>
  <meta name="robots" content="noindex,nofollow"/>
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg"/>
  <link rel="stylesheet" href="styles.css"/>
</head>
<body data-page="login">
  <header class="topbar" id="topbar">
    <a class="brand" href="index.html">
      <img src="assets/vitra-logo.svg" alt="Vitra Studio logo"/>
      <span class="brand-name" data-fa="ویترا استودیو" data-en="Vitra Studio">Vitra Studio</span>
    </a>
    <nav class="t-nav">
      <a href="index.html" data-fa="خانه" data-en="Home">Home</a>
      <a href="services.html" data-fa="خدمات" data-en="Services">Services</a>
      <a href="portfolio.html" data-fa="نمونه‌کارها" data-en="Demos">Demos</a>
      <a href="order.html" data-fa="شروع پروژه" data-en="Start project">Start project</a>
    </nav>
    <button class="lang-btn" type="button">FA</button>
  </header>

  <main>
    <div class="wrap" style="max-width:460px;padding-top:110px;padding-bottom:70px">
      <div style="text-align:center;margin-bottom:26px">
        <p class="kicker" data-fa="ورود مشترک" data-en="Unified sign-in">Unified sign-in</p>
        <h1 data-fa="ورود به پنل" data-en="Sign in to portal">Sign in to portal</h1>
        <p data-fa="با یک فرم وارد شوید؛ بعد از ورود، سایت بر اساس نقش شما پنل مدیر یا پنل کاربر را نشان می‌دهد." data-en="Use one form; after sign-in, the site opens the admin or client panel based on your role.">Use one form; after sign-in, the site opens the admin or client panel based on your role.</p>
      </div>

      <div class="form-wrap">
        <form data-login-form data-login-scope="any" style="display:flex;flex-direction:column;gap:14px">
          <div class="field">
            <label for="l-user" data-fa="ایمیل یا نام کاربری" data-en="Email or username">Email or username</label>
            <input id="l-user" name="username" required autocomplete="username" placeholder="vitra-admin"/>
          </div>
          <div class="field">
            <label for="l-pass" data-fa="رمز عبور" data-en="Password">Password</label>
            <input id="l-pass" name="password" type="password" required autocomplete="current-password" placeholder="Password"/>
          </div>
          <button class="btn btn-primary" type="submit" style="width:100%;justify-content:center" data-fa="ورود" data-en="Sign in">Sign in</button>
          <p class="login-error" data-login-error hidden></p>

          <div class="demo-accounts">
            <div>
              <b data-fa="اکانت مدیر" data-en="Admin account">Admin account</b>
              <span>user: vitra-admin</span>
              <span>pass: Vitra@2026</span>
            </div>
            <div>
              <b data-fa="اکانت کاربر عادی" data-en="Regular user account">Regular user account</b>
              <span>user: vitra-client</span>
              <span>pass: Client@2026</span>
            </div>
          </div>

          <div style="display:flex;gap:8px;flex-wrap:wrap;justify-content:center">
            <button class="btn btn-outline btn-sm" type="button" data-fill-login="admin" data-fa="پر کردن مدیر" data-en="Fill admin">Fill admin</button>
            <button class="btn btn-outline btn-sm" type="button" data-fill-login="client" data-fa="پر کردن کاربر" data-en="Fill user">Fill user</button>
          </div>
        </form>
      </div>

      <p style="text-align:center;margin-top:18px;font-size:13px;color:var(--faint)">
        <a href="index.html" data-fa="بازگشت به سایت" data-en="Back to site">Back to site</a>
      </p>
    </div>
  </main>

  <script src="app.js"></script>
</body>
</html>
