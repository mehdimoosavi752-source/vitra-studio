services:
  mysql:
    image: mysql:8.4
    container_name: allameh-sokhan-mysql
    restart: unless-stopped
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_DATABASE: allameh_sokhan
      MYSQL_USER: allameh
      MYSQL_PASSWORD: allameh_password_change_me
      MYSQL_ROOT_PASSWORD: root_password_change_me
    volumes:
      - allameh_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u allameh -p$${MYSQL_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 10

  web:
    build: .
    container_name: allameh-sokhan-web
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: allameh_sokhan
      DB_USER: allameh
      DB_PASSWORD: allameh_password_change_me
      ADMIN_EMAIL: admin@asmdi.ir
      ADMIN_PASSWORD: Admin1234
      ADMIN_NAME: مدیر سایت
      SESSION_SECRET: change_this_to_a_long_random_secret
      RESET_ADMIN_PASSWORD: "false"

volumes:
  allameh_mysql_data:
